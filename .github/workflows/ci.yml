name: Synthetic identity gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Prepare pinned offline semantic test runtime
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r semantic/requirements.txt
          echo "PINOCCHIO_TEST_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
      - run: npm test
      - name: Publish only the synthetic compatibility summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-host-compatibility
          path: |
            test-results/public-host.json
            test-results/bound-mcp.json
            test-results/production-bindings.json
            test-results/memory-workflow.json
            test-results/semantic.json
            test-results/reliability.json
            test-results/installation.json
          if-no-files-found: error
          retention-days: 7
