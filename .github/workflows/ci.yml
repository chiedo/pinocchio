name: Synthetic identity gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Start required CI timer
        run: echo "PINOCCHIO_CI_STARTED_AT=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: semantic/requirements.txt
      - id: semantic-model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pinocchio-semantic-model
          key: semantic-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('semantic/model.json') }}
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.63.0
      - run: npm ci
      - name: Prepare pinned offline semantic test runtime
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r semantic/requirements.txt
          echo "PINOCCHIO_TEST_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
      - run: npm test
        env:
          PINOCCHIO_NPM_CACHE_HIT: ${{ steps.setup-node.outputs.cache-hit }}
          PINOCCHIO_PIP_CACHE_HIT: ${{ steps.setup-python.outputs.cache-hit }}
          PINOCCHIO_MODEL_CACHE_HIT: ${{ steps.semantic-model-cache.outputs.cache-hit }}
          PINOCCHIO_PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
          PINOCCHIO_TEST_MODEL_CACHE: ${{ runner.temp }}/pinocchio-semantic-model
      - name: Package pinned preview only after the complete suite passes
        run: |
          mkdir -p build
          npm run package:release -- build/pinocchio
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
            -czf build/pinocchio-cli-preview.tgz -C build pinocchio
          (cd build && sha256sum pinocchio-cli-preview.tgz > SHA256SUMS)
      - name: Publish the preview payload, not runtime state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-preview-linux-x64
          path: |
            build/pinocchio-cli-preview.tgz
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Finalize public CI timing
        if: always()
        run: node scripts/finalize-ci-timing.mjs
      - name: Publish only the synthetic compatibility summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-host-compatibility
          path: |
            test-results/public-host.json
            test-results/bound-mcp.json
            test-results/production-bindings.json
            test-results/memory-workflow.json
            test-results/semantic.json
            test-results/reliability.json
            test-results/installation.json
            test-results/ci-timing.json
          if-no-files-found: error
          retention-days: 7
